name: Security Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  NPM_CACHE_FOLDER: ~/.npm
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm run security:audit

      - name: Upload security audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-results
          path: |
            npm-audit.json
            security-audit.log

  unit-security-tests:
    name: Unit Security Tests
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit security tests
        run: npm run test:unit:security

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-security-test-results
          path: |
            coverage/
            test-results/

  integration-security-tests:
    name: Integration Security Tests
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration security tests
        run: npm run test:integration:security

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-security-test-results
          path: |
            coverage/
            test-results/

  e2e-security-tests:
    name: E2E Security Tests
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application
        run: npm run build

      - name: Start application
        run: npm start &
        env:
          NODE_ENV: test
          PORT: 3000

      - name: Wait for application to start
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run E2E security tests
        run: npm run test:e2e:security

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-security-test-results
          path: |
            test-results/
            playwright-report/

  comprehensive-security-tests:
    name: Comprehensive Security Tests
    runs-on: ubuntu-latest
    needs: [unit-security-tests, integration-security-tests, e2e-security-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application
        run: npm run build

      - name: Start application
        run: npm start &
        env:
          NODE_ENV: test
          PORT: 3000

      - name: Wait for application to start
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run comprehensive security tests
        run: npm run test:security

      - name: Upload comprehensive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comprehensive-security-test-results
          path: |
            security-test-report.json
            test-results/
            coverage/

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'bastet-console'
          path: '.'
          format: 'JSON'
          args: '--enableRetired --enableExperimental'

      - name: Upload dependency scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-results
          path: |
            dependency-check-report.json
            snyk-results.json

  code-quality-scan:
    name: Code Quality Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint security rules
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --config .eslintrc.security.js

      - name: Run TypeScript security check
        run: npx tsc --noEmit --strict

      - name: Run security-focused linting
        run: npm run lint:security

      - name: Upload code quality results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-quality-results
          path: |
            eslint-report.json
            typescript-report.json

  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [comprehensive-security-tests, dependency-scan, code-quality-scan]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate security report
        run: |
          echo "# Security Test Report" > security-report.md
          echo "Generated on: $(date)" >> security-report.md
          echo "" >> security-report.md
          echo "## Test Results Summary" >> security-report.md
          echo "- Unit Tests: ${{ needs.unit-security-tests.result }}" >> security-report.md
          echo "- Integration Tests: ${{ needs.integration-security-tests.result }}" >> security-report.md
          echo "- E2E Tests: ${{ needs.e2e-security-tests.result }}" >> security-report.md
          echo "- Comprehensive Tests: ${{ needs.comprehensive-security-tests.result }}" >> security-report.md
          echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> security-report.md
          echo "- Code Quality: ${{ needs.code-quality-scan.result }}" >> security-report.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('security-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  notify-on-failure:
    name: Notify on Security Test Failure
    runs-on: ubuntu-latest
    needs: [comprehensive-security-tests, dependency-scan, code-quality-scan]
    if: failure()
    steps:
      - name: Notify security team
        run: |
          echo "Security tests failed! Please check the workflow results."
          # Add notification logic here (Slack, email, etc.)
